[project]
name = "vextis-agent-runtime"
version = "0.1.0"
description = "Agent orchestration runtime for Vextis ERP."
readme = "README.md"
authors = [{ name = "Rafael Patiño Díaz" }]
license = "Apache-2.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.140.8,<0.141",
    "google-adk>=2.7.1,<3",
    "google-auth[requests]>=2.40,<3",
    "google-cloud-aiplatform[agent_engines]>=1.153,<2",
    "google-genai>=2.12.1,<3",
    "httpx>=0.28,<1",
    "pydantic-settings>=2.10,<3",
    "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
    "mypy>=1.17,<2",
    "pytest>=8.4,<9",
    "pytest-asyncio>=1.1,<2",
    "pytest-cov>=6.2,<7",
    "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vextis_agents"]

[tool.pytest.ini_options]
# model_eval is deselected here, not excluded from testpaths: the behavioural
# evals call Vertex AI and are non-deterministic, which does not belong in the
# CI gate, but "uv run pytest -m model_eval" still finds and runs them.
addopts = "--strict-markers --strict-config --cov=vextis_agents --cov-report=term-missing -m 'not model_eval'"
testpaths = ["tests"]
markers = [
    "model_eval: behavioural evaluation against a real Vertex AI model; needs GOOGLE_CLOUD_PROJECT and VEXTIS_GEMINI_MODEL",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]
