spring:
  application:
    name: vextis-enterprise-core
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/vextis}
    username: ${POSTGRES_USER:vextis}
    password: ${POSTGRES_PASSWORD:vextis_local_only}
    hikari:
      maximum-pool-size: ${VEXTIS_DB_POOL_MAX_SIZE:4}
      minimum-idle: ${VEXTIS_DB_POOL_MIN_IDLE:0}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  graphql:
    path: /graphql
    graphiql:
      enabled: ${GRAPHQL_GRAPHIQL_ENABLED:false}

server:
  port: ${ENTERPRISE_CORE_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

vextis:
  exposure: ${VEXTIS_EXPOSURE:INTERNAL}
  firebase:
    project-id: ${VEXTIS_FIREBASE_PROJECT_ID:${GOOGLE_CLOUD_PROJECT:}}
  demo:
    tenant-id: ${VEXTIS_DEMO_TENANT_ID:demo-tenant}
    actor-id: ${VEXTIS_DEMO_ACTOR_ID:demo-user}
    # Seeding and the destructive reset are administrative, not agent tools:
    # they get their own credential so the token Agent Runtime carries for
    # business reads cannot purge a tenant. Unset means the endpoints are
    # disabled, except under LOCAL exposure.
    admin-token: ${VEXTIS_DEMO_ADMIN_TOKEN:}
  agent-tools:
    service-token: ${VEXTIS_AGENT_TOOLS_TOKEN:}
    coordinator-agent-id: ${VEXTIS_COORDINATOR_AGENT_ID:coordinator-agent}
    # The publicly reachable Live gateway presents its own credential, which
    # resolves to its own service identity. The registry entries bound to that
    # identity are read-only, so a leak of this token cannot reserve stock or
    # issue an invoice. It must differ from service-token; sharing the value is
    # refused at startup.
    live-gateway-token: ${VEXTIS_LIVE_GATEWAY_TOKEN:}
    live-gateway-agent-id: ${VEXTIS_LIVE_GATEWAY_AGENT_ID:live-gateway-agent}
  pubsub:
    enabled: ${VEXTIS_PUBSUB_ENABLED:false}
    project-id: ${GOOGLE_CLOUD_PROJECT:}
    topic-id: ${VEXTIS_PUBSUB_TOPIC_ID:order-events}
    batch-size: ${VEXTIS_OUTBOX_BATCH_SIZE:10}
    fixed-delay: ${VEXTIS_OUTBOX_FIXED_DELAY:2s}
  documents:
    bucket-name: ${VEXTIS_DOCUMENTS_BUCKET:}
    signing-service-account: ${VEXTIS_DOCUMENTS_SIGNING_SERVICE_ACCOUNT:}
  rag:
    # Retrieval only compares vectors produced the same way. The demo seeder
    # writes deterministic SHA-256 mock vectors, which are meaningful only when
    # the agents query with the same mock embedder, so seeding them is opt-in
    # and off by default.
    mock-embeddings:
      enabled: ${VEXTIS_RAG_MOCK_EMBEDDINGS_ENABLED:false}
    min-similarity: ${VEXTIS_RAG_MIN_SIMILARITY:0.55}
  agent-runtime:
    chat-url: ${VEXTIS_AGENT_RUNTIME_CHAT_URL:}
    callback-token: ${VEXTIS_CORE_CALLBACK_TOKEN:}
    public-websocket-base-url: ${VEXTIS_AGENT_RUNTIME_PUBLIC_WS_URL:}
