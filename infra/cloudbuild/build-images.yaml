steps:
  - name: gcr.io/cloud-builders/docker
    id: build-enterprise-core
    args:
      - build
      - --file
      - services/enterprise-core/Dockerfile
      - --tag
      - us-central1-docker.pkg.dev/$PROJECT_ID/vextis/enterprise-core:${_TAG}
      - .

  - name: gcr.io/cloud-builders/docker
    id: push-enterprise-core
    args:
      - push
      - us-central1-docker.pkg.dev/$PROJECT_ID/vextis/enterprise-core:${_TAG}

  - name: gcr.io/cloud-builders/docker
    id: build-agent-runtime
    args:
      - build
      - --file
      - services/agent-runtime/Dockerfile
      - --tag
      - us-central1-docker.pkg.dev/$PROJECT_ID/vextis/agent-runtime:${_TAG}
      - .

  - name: gcr.io/cloud-builders/docker
    id: push-agent-runtime
    args:
      - push
      - us-central1-docker.pkg.dev/$PROJECT_ID/vextis/agent-runtime:${_TAG}

  - name: gcr.io/cloud-builders/docker
    id: build-web
    args:
      - build
      - --file
      - apps/web/Dockerfile
      - --tag
      - us-central1-docker.pkg.dev/$PROJECT_ID/vextis/web:${_TAG}
      - .

  - name: gcr.io/cloud-builders/docker
    id: push-web
    args:
      - push
      - us-central1-docker.pkg.dev/$PROJECT_ID/vextis/web:${_TAG}

options:
  logging: CLOUD_LOGGING_ONLY

timeout: 1800s
