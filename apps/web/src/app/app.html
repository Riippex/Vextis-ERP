@if (!hideChrome()) {
  <mat-toolbar class="shell__toolbar">
    <div class="shell__toolbar-inner">
    <div class="brand" aria-label="Vextis ERP">
      <span class="brand__mark">
        <svg width="26" height="26" viewBox="0 0 40 40" fill="none" aria-hidden="true">
          <defs>
            <linearGradient id="vxtLogoGradient" x1="4" y1="8" x2="36" y2="10" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#2568c9" />
              <stop offset="100%" stop-color="#7c5cff" />
            </linearGradient>
          </defs>
          <path
            d="M6 9c0-1.7 1.3-3 3-3s3 1.3 3 3c0 .9-.4 1.7-1 2.3l7 12.1 12-6.7c-.6-.5-1-1.3-1-2.1 0-1.7 1.3-3 3-3s3 1.3 3 3-1.3 3-3 3c-.3 0-.6 0-.9-.1L18.6 30.4c-.5.9-1.5 1.5-2.6 1.5-1.7 0-3-1.3-3-3 0-.5.1-1 .4-1.4L6.7 12.6C6.3 12 6 11 6 9Z"
            fill="url(#vxtLogoGradient)"
          />
          <circle cx="9" cy="9" r="3" fill="#2568c9" />
          <circle cx="30" cy="14" r="2.6" fill="#7c5cff" />
          <circle cx="16" cy="27.5" r="2.6" fill="#7c5cff" opacity="0.9" />
        </svg>
      </span>
      <span class="brand__word">Vextis</span>
    </div>

    <div class="shell__actions">
      <span class="shell__environment">Hackathon workspace</span>
      <button
        mat-icon-button
        type="button"
        [attr.aria-label]="isDark() ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro'"
        (click)="toggleTheme()"
      >
        <mat-icon>{{ isDark() ? 'light_mode' : 'dark_mode' }}</mat-icon>
      </button>
      <button mat-icon-button type="button" aria-label="Cerrar sesiÃ³n" (click)="signOut()">
        <mat-icon>logout</mat-icon>
      </button>
    </div>
    </div>
  </mat-toolbar>
}

<main class="shell__content" [class.shell__content--bare]="hideChrome()">
  <router-outlet />
</main>
