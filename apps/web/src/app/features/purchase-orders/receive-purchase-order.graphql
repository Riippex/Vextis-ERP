mutation ReceivePurchaseOrder($input: ReceivePurchaseOrderInput!) {
  receivePurchaseOrder(input: $input) {
    purchaseOrder {
      id
      purchaseOrderNumber
      customerName
      documentUri
      receivedAt
    }
    execution {
      id
      goal
      state
      correlationId
      createdAt
      updatedAt
      timeline {
        sequence
        type
        title
        detail
        occurredAt
      }
      plan {
        summary
        modelId
        generatedAt
        steps {
          sequence
          department
          objective
          requiresApproval
        }
      }
    }
  }
}
