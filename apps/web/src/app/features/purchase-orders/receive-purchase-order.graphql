mutation ReceivePurchaseOrder($input: ReceivePurchaseOrderInput!) {
  receivePurchaseOrder(input: $input) {
    purchaseOrder {
      id
      purchaseOrderNumber
      customerName
      documentUri
      receivedAt
    }
    execution {
      id
      goal
      state
      correlationId
      createdAt
      updatedAt
      timeline {
        sequence
        type
        title
        detail
        occurredAt
      }
      plan {
        summary
        modelId
        generatedAt
        requestedPaymentTermsDays
        orderLines {
          sku
          quantity
        }
        steps {
          sequence
          department
          objective
          requiresApproval
        }
      }
      readiness {
        evaluatedAt
        checks {
          department
          status
          detail
        }
      }
      approval {
        id
        recommendation
        status
        requestedBy
        requestedAt
        expiresAt
        decidedBy
        decidedAt
        reason
      }
    }
  }
}
