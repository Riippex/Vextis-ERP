mutation ReceivePurchaseOrder($input: ReceivePurchaseOrderInput!) {
  receivePurchaseOrder(input: $input) {
    purchaseOrder {
      id
      purchaseOrderNumber
      customerName
      documentUri
      receivedAt
    }
    execution {
      id
      goal
      state
      correlationId
      createdAt
      updatedAt
      timeline {
        sequence
        type
        title
        detail
        occurredAt
      }
      plan {
        summary
        modelId
        generatedAt
        requestedPaymentTermsDays
        orderLines {
          sku
          quantity
          unitPrice
        }
        currency
        steps {
          sequence
          department
          objective
          requiresApproval
        }
      }
      readiness {
        evaluatedAt
        checks {
          department
          status
          detail
        }
      }
      approval {
        id
        recommendation
        status
        requestedBy
        requestedAt
        expiresAt
        decidedBy
        decidedAt
        reason
      }
      invoice {
        id
        orderId
        executionId
        customerName
        currency
        subtotal
        tax
        total
        status
        paymentTermsDays
        issuedAt
        correlationId
        lines {
          sku
          quantity
          unitPrice
          lineSubtotal
        }
      }
      proposalAssets {
        id
        quoteId
        storageUri
        mediaType
        modelId
        promptSummary
        aiLabel
        createdAt
      }
      auditTrail {
        id
        correlationId
        actorType
        actorId
        action
        toolName
        resourceType
        resourceId
        result
        occurredAt
        approvedAgent {
          agentId
          version
          displayName
          modelId
          promptVersion
          serviceIdentity
        }
      }
    }
  }
}
