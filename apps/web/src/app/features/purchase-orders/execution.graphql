query FindExecution($id: ID!) {
  execution(id: $id) {
    id
    goal
    state
    correlationId
    createdAt
    updatedAt
    timeline {
      sequence
      type
      title
      detail
      occurredAt
    }
    plan {
      summary
      modelId
      generatedAt
      steps {
        sequence
        department
        objective
        requiresApproval
      }
    }
  }
}
