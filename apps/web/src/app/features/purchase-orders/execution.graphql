query FindExecution($id: ID!) {
  execution(id: $id) {
    id
    goal
    state
    correlationId
    createdAt
    updatedAt
    timeline {
      sequence
      type
      title
      detail
      occurredAt
    }
    plan {
      summary
      modelId
      generatedAt
      requestedPaymentTermsDays
      orderLines {
        sku
        quantity
      }
      steps {
        sequence
        department
        objective
        requiresApproval
      }
    }
    readiness {
      evaluatedAt
      checks {
        department
        status
        detail
      }
    }
    approval {
      id
      recommendation
      status
      requestedBy
      requestedAt
      expiresAt
      decidedBy
      decidedAt
      reason
    }
    auditTrail {
      id
      correlationId
      actorType
      actorId
      action
      toolName
      resourceType
      resourceId
      result
      occurredAt
      approvedAgent {
        agentId
        version
        displayName
        modelId
        promptVersion
        serviceIdentity
      }
    }
  }
}
