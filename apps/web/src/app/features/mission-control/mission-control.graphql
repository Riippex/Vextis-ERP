query MissionControl {
  missionControl {
    agents {
      agentId
      version
      displayName
      department
      purpose
      framework
      modelId
      promptVersion
      serviceIdentity
      status
      capabilities
      allowedTools
    }
    recentAgentActivities {
      conversationId
      messageId
      agentId
      agentVersion
      displayName
      modelId
      promptVersion
      tools
      occurredAt
    }
    executions {
      id
      purchaseOrderNumber
      customerName
      state
      correlationId
      updatedAt
    }
    customers {
      id
      legalName
      active
    }
    stockItems {
      sku
      availableQuantity
    }
    stockReservations {
      id
      orderId
      sku
      quantity
      status
      createdAt
    }
    creditProfiles {
      customerId
      customerName
      standing
      maxPaymentTermsDays
    }
    invoices {
      id
      orderId
      executionId
      customerName
      currency
      subtotal
      tax
      total
      status
      paymentTermsDays
      issuedAt
      correlationId
      lines {
        sku
        quantity
        unitPrice
        lineSubtotal
      }
    }
    executionVolumeByDepartment {
      department
      count
    }
    completedOrdersPerWeek {
      weekStart
      count
    }
  }
}
