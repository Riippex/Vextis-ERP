query MissionControl {
  missionControl {
    executions {
      id
      purchaseOrderNumber
      customerName
      state
      correlationId
      updatedAt
    }
    customers {
      id
      legalName
      active
    }
    stockItems {
      sku
      availableQuantity
    }
    stockReservations {
      id
      orderId
      sku
      quantity
      status
      createdAt
    }
    creditProfiles {
      customerId
      customerName
      standing
      maxPaymentTermsDays
    }
  }
}
