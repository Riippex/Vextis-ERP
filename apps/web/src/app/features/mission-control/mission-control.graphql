query MissionControl {
  missionControl {
    agents {
      agentId
      version
      displayName
      department
      purpose
      framework
      modelId
      promptVersion
      serviceIdentity
      status
      capabilities
      allowedTools
    }
    recentAgentActivities {
      conversationId
      messageId
      agentId
      agentVersion
      displayName
      modelId
      promptVersion
      tools
      occurredAt
    }
    executions {
      id
      purchaseOrderNumber
      customerName
      state
      correlationId
      updatedAt
    }
    customers {
      id
      legalName
      active
    }
    stockItems {
      sku
      availableQuantity
    }
    stockReservations {
      id
      orderId
      sku
      quantity
      status
      createdAt
    }
    creditProfiles {
      customerId
      customerName
      standing
      maxPaymentTermsDays
    }
    executionVolumeByDepartment {
      department
      count
    }
  }
}
