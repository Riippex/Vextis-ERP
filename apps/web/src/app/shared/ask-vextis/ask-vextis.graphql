mutation AskVextis($input: AskVextisMessageInput!) {
  askVextis(input: $input) {
    conversationId
    messageId
    reply
    createdAt
    agentActivities {
      agentId
      agentVersion
      displayName
      modelId
      promptVersion
      tools
    }
  }
}

query AskVextisConversation($id: ID!) {
  askVextisConversation(id: $id) {
    id
    messages {
      id
      sender
      content
      kind
      createdAt
      agentActivities {
        agentId
        agentVersion
        displayName
        modelId
        promptVersion
        tools
      }
    }
  }
}
