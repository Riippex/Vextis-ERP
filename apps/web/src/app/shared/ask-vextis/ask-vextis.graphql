mutation AskVextis($input: AskVextisMessageInput!) {
  askVextis(input: $input) {
    conversationId
    messageId
    reply
    createdAt
    agentActivities {
      agentId
      agentVersion
      displayName
      modelId
      promptVersion
      tools
    }
    memoryEvidence {
      provider
      available
      contextCount
      preferenceStored
    }
  }
}

query AskVextisConversation($id: ID!) {
  askVextisConversation(id: $id) {
    id
    messages {
      id
      sender
      content
      kind
      createdAt
      agentActivities {
        agentId
        agentVersion
        displayName
        modelId
        promptVersion
        tools
      }
      memoryEvidence {
        provider
        available
        contextCount
        preferenceStored
      }
    }
  }
}

mutation CreateLiveSession($input: CreateLiveSessionInput!) {
  createLiveSession(input: $input) {
    id
    websocketUrl
    sessionToken
    expiresAt
  }
}

mutation CloseLiveSession($id: ID!) {
  closeLiveSession(id: $id)
}
