name: Deploy Web

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: deploy-web-hackathon
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  changes:
    name: Detect web changes
    if: >-
      (github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    outputs:
      required: ${{ steps.filter.outputs.required }}
      sha: ${{ steps.filter.outputs.sha }}
    steps:
      - name: Check out validated revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || 'main' }}
          fetch-depth: 2

      - name: Detect deployable web changes
        id: filter
        shell: bash
        run: |
          set -euo pipefail
          deploy_sha="$(git rev-parse HEAD)"
          echo "sha=${deploy_sha}" >> "${GITHUB_OUTPUT}"

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            echo "required=true" >> "${GITHUB_OUTPUT}"
          elif git diff --quiet "${deploy_sha}^1" "${deploy_sha}" -- \
            apps/web contracts/graphql firebase.json .firebaserc \
            package.json pnpm-lock.yaml pnpm-workspace.yaml \
            .github/workflows/deploy-web.yml; then
            echo "required=false" >> "${GITHUB_OUTPUT}"
          else
            echo "required=true" >> "${GITHUB_OUTPUT}"
          fi

  deploy:
    name: Deploy Angular to Firebase Hosting
    needs: changes
    if: needs.changes.outputs.required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: hackathon
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out validated revision
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.changes.outputs.sha }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Angular
        run: pnpm web:build

      - name: Authenticate to Google Cloud without keys
        uses: google-github-actions/auth@v3
        with:
          project_id: vextis-erp
          workload_identity_provider: projects/797183513325/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: vextis-build-hackathon@vextis-erp.iam.gserviceaccount.com

      - name: Deploy Firebase Hosting
        env:
          DEPLOY_SHA: ${{ needs.changes.outputs.sha }}
        run: >-
          npx --yes firebase-tools@15.28.1 deploy
          --only hosting
          --project vextis-erp
          --non-interactive
          --message "Web ${DEPLOY_SHA}"
