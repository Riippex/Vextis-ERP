asyncapi: 3.0.0
info:
  title: Vextis Domain Events
  version: 0.1.0
  description: Eventos publicados mediante transactional outbox y transportados por Pub/Sub.
channels:
  orderEvents:
    address: order-events
    messages:
      purchaseOrderReceived:
        $ref: "#/components/messages/PurchaseOrderReceivedV2"
      workflowApprovalRequested:
        $ref: "#/components/messages/WorkflowApprovalRequestedV1"
      workflowApprovalDecided:
        $ref: "#/components/messages/WorkflowApprovalDecidedV1"
      inventoryReservationCreated:
        $ref: "#/components/messages/InventoryReservationCreatedV1"
      billingInvoiceIssued:
        $ref: "#/components/messages/BillingInvoiceIssuedV1"
      quoteVisualGenerated:
        $ref: "#/components/messages/QuoteVisualGeneratedV1"
operations:
  receivePurchaseOrder:
    action: receive
    channel:
      $ref: "#/channels/orderEvents"
    messages:
      - $ref: "#/channels/orderEvents/messages/purchaseOrderReceived"
  publishWorkflowApprovalRequested:
    action: send
    channel:
      $ref: "#/channels/orderEvents"
    messages:
      - $ref: "#/channels/orderEvents/messages/workflowApprovalRequested"
  publishWorkflowApprovalDecided:
    action: send
    channel:
      $ref: "#/channels/orderEvents"
    messages:
      - $ref: "#/channels/orderEvents/messages/workflowApprovalDecided"
  publishInventoryReservationCreated:
    action: send
    channel:
      $ref: "#/channels/orderEvents"
    messages:
      - $ref: "#/channels/orderEvents/messages/inventoryReservationCreated"
  publishBillingInvoiceIssued:
    action: send
    channel:
      $ref: "#/channels/orderEvents"
    messages:
      - $ref: "#/channels/orderEvents/messages/billingInvoiceIssued"
  publishQuoteVisualGenerated:
    action: send
    channel:
      $ref: "#/channels/orderEvents"
    messages:
      - $ref: "#/channels/orderEvents/messages/quoteVisualGenerated"
components:
  messages:
    PurchaseOrderReceivedV2:
      name: purchase_order.received
      title: Purchase order received (v2)
      payload:
        $ref: "./schemas/purchase-order-received.v2.json"
    WorkflowApprovalRequestedV1:
      name: workflow.approval.requested
      title: Workflow approval requested (v1)
      payload:
        $ref: "./schemas/workflow-approval-requested.v1.json"
    WorkflowApprovalDecidedV1:
      name: workflow.approval.decided
      title: Workflow approval decided (v1)
      payload:
        $ref: "./schemas/workflow-approval-decided.v1.json"
    InventoryReservationCreatedV1:
      name: inventory.reservation.created
      title: Inventory reservation created (v1)
      payload:
        $ref: "./schemas/inventory-reservation-created.v1.json"
    BillingInvoiceIssuedV1:
      name: billing.invoice.issued
      title: Billing invoice issued (v1)
      payload:
        $ref: "./schemas/billing-invoice-issued.v1.json"
    QuoteVisualGeneratedV1:
      name: quote.visual.generated
      title: Quote visual generated (v1)
      payload:
        $ref: "./schemas/quote-visual-generated.v1.json"
