openapi: 3.1.0
info:
  title: Vextis Agent Runtime API
  version: 0.1.0
  description: Authenticated callbacks from Enterprise Core to the Gemini and ADK runtime.
servers:
  - url: /
paths:
  /v1/chat/complete:
    post:
      operationId: completeAgentChat
      description: >-
        Completes one Ask Vextis turn and returns bounded public execution evidence. Evidence
        contains logical agent and tool names only; prompts, arguments, tool results, and hidden
        reasoning are never returned. A bounded, tenant-scoped conversation history may be
        supplied as untrusted context for resolving follow-up references; it is never business
        evidence or authorization.
      security:
        - serviceBearer: []
      parameters:
        - name: X-Tenant-Id
          in: header
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 100
        - name: X-Correlation-Id
          in: header
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 100
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatCompleteRequest"
      responses:
        "200":
          description: Completed text response with bounded agent activity evidence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatCompleteResponse"
        "401":
          description: Missing or invalid Enterprise Core credential
        "422":
          description: An explicit memory request is outside the supported preference policy
        "503":
          description: Gemini, ADK, or an explicit durable-memory write is unavailable
components:
  securitySchemes:
    serviceBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque-service-token
  schemas:
    ChatCompleteRequest:
      type: object
      additionalProperties: false
      required: [tenantId, actorId, conversationId, message]
      properties:
        tenantId:
          type: string
          minLength: 1
          maxLength: 100
          example: demo-tenant
        actorId:
          type: string
          minLength: 1
          maxLength: 128
        conversationId:
          type: string
          format: uuid
        message:
          type: string
          minLength: 1
          maxLength: 4000
        history:
          type: array
          maxItems: 12
          default: []
          description: >-
            Previous tenant-scoped turns in chronological order. The sum of content is limited
            to 12000 characters by both producer and consumer.
          items:
            $ref: "#/components/schemas/ChatHistoryTurn"
    ChatHistoryTurn:
      type: object
      additionalProperties: false
      required: [role, content]
      properties:
        role:
          type: string
          enum: [USER, ASSISTANT]
        content:
          type: string
          minLength: 1
          maxLength: 4000
    ChatCompleteResponse:
      type: object
      additionalProperties: false
      required: [reply, activities]
      properties:
        reply:
          type: string
          minLength: 1
          maxLength: 12000
        activities:
          type: array
          maxItems: 4
          items:
            $ref: "#/components/schemas/AgentActivity"
        memory:
          oneOf:
            - $ref: "#/components/schemas/MemoryEvidence"
            - type: "null"
    AgentActivity:
      type: object
      additionalProperties: false
      required: [agentId, tools]
      properties:
        agentId:
          type: string
          minLength: 1
          maxLength: 150
          pattern: "^[A-Za-z0-9._-]+$"
          example: vextis_inventory_agent
        tools:
          type: array
          maxItems: 8
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 100
            pattern: "^[a-z0-9_]+$"
          example: [get_stock]
    MemoryEvidence:
      type: object
      additionalProperties: false
      required: [provider, available, contextCount, preferenceStored]
      properties:
        provider:
          type: string
          const: VERTEX_AI_MEMORY_BANK
        available:
          type: boolean
        contextCount:
          type: integer
          minimum: 0
          maximum: 5
        preferenceStored:
          type: boolean
