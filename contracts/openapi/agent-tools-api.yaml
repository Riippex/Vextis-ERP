openapi: 3.1.0
info:
  title: Vextis Agent Tools API
  version: 0.5.0
  description: >-
    API interna autenticada para invocar casos de uso del Enterprise Core. The service
    credential authenticates Agent Runtime, while X-Agent-Id identifies the delegated
    logical agent whose active registry policy is enforced for each operation.
servers:
  - url: /internal/agent-tools/v1
paths:
  /crm/customers/lookup:
    get:
      operationId: lookupCustomerByLegalName
      x-vextis-tool-policy: lookup_customer
      description: Returns authoritative tenant-scoped customer context without mutating state.
      security:
        - serviceBearer: []
      parameters:
        - name: legalName
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 200
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/AgentId"
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Customer context found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerContext"
        "401":
          description: Missing or invalid service credential
        "403":
          description: Logical agent is inactive, belongs to another service, tenant, or tool policy
        "404":
          description: Customer was not found in the tenant
  /crm/quotes/{quoteId}/assets/preflight:
    post:
      operationId: preflightProposalAsset
      x-vextis-tool-policy: register_quote_asset
      description: >-
        Validates authorization, quote ownership, and correlation, and reserves an atomic
        idempotency slot before generating or uploading an asset. Guarantees zero Vertex/Storage spend on invalid requests.
      security:
        - serviceBearer: []
      parameters:
        - name: quoteId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/AgentId"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PreflightProposalAssetRequest"
      responses:
        "200":
          description: Preflight validation successful; generation is authorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreflightProposalAssetResponse"
        "400":
          description: Invalid parameters or correlation mismatch
        "401":
          description: Missing or invalid service credential
        "403":
          description: Logical agent is inactive or not authorized for this tool
        "404":
          description: Quote or execution was not found for this tenant
        "409":
          description: Idempotency key conflict (existing reservation has different payload fingerprint)
        "503":
          description: Enterprise Core is temporarily unavailable
  /crm/quotes/{quoteId}/assets:
    post:
      operationId: registerProposalAsset
      x-vextis-tool-policy: register_quote_asset
      description: >-
        Registers a visual or media asset (e.g. Imagen proposal visual) generated for
        a CRM quote or proposal. Cloud Storage stores the asset while Enterprise Core
        records the relationship, provenance, and audit trail.
      security:
        - serviceBearer: []
      parameters:
        - name: quoteId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/AgentId"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterProposalAssetRequest"
      responses:
        "201":
          description: Proposal asset registered, or original idempotent asset returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProposalAsset"
        "400":
          description: Invalid request payload or correlation mismatch
        "401":
          description: Missing or invalid service credential
        "403":
          description: Logical agent is inactive or not authorized for this tool
        "404":
          description: Quote or execution was not found for this tenant
        "409":
          description: Conflicting state or duplicate non-idempotent registration
        "503":
          description: Storage or Enterprise Core is temporarily unavailable
  /inventory/stock/{sku}:
    get:
      operationId: getStockBySku
      x-vextis-tool-policy: get_stock
      description: Returns authoritative tenant-scoped stock without reserving or mutating it.
      security:
        - serviceBearer: []
      parameters:
        - name: sku
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 100
            pattern: "^[A-Za-z0-9._-]+$"
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/AgentId"
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Stock context found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockContext"
        "401":
          description: Missing or invalid service credential
        "403":
          description: Logical agent is inactive, belongs to another service, tenant, or tool policy
        "404":
          description: SKU was not found in the tenant
  /billing/customers/{customerId}/credit:
    get:
      operationId: getCustomerCredit
      x-vextis-tool-policy: get_credit
      description: Returns authoritative tenant-scoped credit context without mutating it.
      security:
        - serviceBearer: []
      parameters:
        - name: customerId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/AgentId"
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Credit context found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreditContext"
        "401":
          description: Missing or invalid service credential
        "403":
          description: Logical agent is inactive, belongs to another service, tenant, or tool policy
        "404":
          description: Credit profile was not found in the tenant
  /workflows/{executionId}/planning:
    post:
      operationId: startExecutionPlanning
      x-vextis-tool-policy: start_execution_planning
      security:
        - serviceBearer: []
      parameters:
        - name: executionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/AgentId"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartPlanningRequest"
      responses:
        "200":
          description: Execution moved to planning, or the idempotent result was returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanningContext"
        "401":
          description: Missing or invalid service credential
        "403":
          description: Agent is not authorized; trusted execution context is recorded as denied evidence
        "409":
          description: Event context does not match the execution or the transition is invalid
  /workflows/{executionId}/plan:
    post:
      operationId: recordExecutionPlan
      x-vextis-tool-policy: record_execution_plan
      security:
        - serviceBearer: []
      parameters:
        - name: executionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/AgentId"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordPlanRequest"
      responses:
        "200":
          description: Structured plan recorded and execution moved to running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowExecution"
        "401":
          description: Missing or invalid service credential
        "403":
          description: Agent is not authorized; trusted execution context is recorded as denied evidence
        "409":
          description: Execution context or state does not allow recording the plan
  /workflows/{executionId}/readiness:
    post:
      operationId: evaluateOrderReadiness
      x-vextis-tool-policy: evaluate_order_readiness
      security:
        - serviceBearer: []
      parameters:
        - name: executionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/AgentId"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Authoritative read-only checks were evaluated and recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowExecution"
        "401":
          description: Missing or invalid service credential
        "403":
          description: Agent is not authorized; trusted execution context is recorded as denied evidence
        "409":
          description: The execution has no structured order facts or cannot be evaluated
  /workflows/{executionId}/approval:
    post:
      operationId: requestWorkflowApproval
      x-vextis-tool-policy: request_workflow_approval
      security:
        - serviceBearer: []
      parameters:
        - name: executionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/AgentId"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestApprovalRequest"
      responses:
        "200":
          description: Recommendation was bound to Core evidence and is waiting for human approval
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowExecution"
        "401":
          description: Missing or invalid service credential
        "403":
          description: Agent is not authorized; trusted execution context is recorded as denied evidence
        "409":
          description: Readiness is missing or the execution is not eligible for approval
  /inventory/reservations:
    post:
      operationId: reserveStock
      x-vextis-tool-policy: reserve_stock
      security:
        - serviceBearer: []
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/AgentId"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReserveStockRequest"
      responses:
        "201":
          description: Stock reserved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reservation"
        "401":
          description: Missing or invalid service credential
        "403":
          description: Agent is not authorized for this tool or scope
        "409":
          description: Insufficient stock or conflicting business state
  /billing/orders/{orderId}/invoice:
    post:
      operationId: createInvoice
      x-vextis-tool-policy: create_invoice
      description: >-
        Issues the single Finance-owned invoice from the approved plan after every
        order line is reserved. Prices and currency are read from Core's persisted
        approved context; the agent cannot submit or calculate financial totals.
      security:
        - serviceBearer: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/AgentId"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IssueInvoiceRequest"
      responses:
        "201":
          description: Invoice issued, or the original idempotent invoice was returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
        "401":
          description: Missing or invalid service credential
        "403":
          description: Logical agent is not authorized for invoice issuance
        "404":
          description: Approved order execution was not found in the tenant
        "409":
          description: Order is not approved, completed, fully reserved, or priced
  /rag/search:
    post:
      operationId: searchKnowledgeBase
      x-vextis-tool-policy: search_knowledge_base
      description: Searches tenant-scoped grounded knowledge base chunks using vector similarity.
      security:
        - serviceBearer: []
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/AgentId"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchKnowledgeRequest"
      responses:
        "200":
          description: Matching knowledge chunks returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchKnowledgeResponse"
        "401":
          description: Missing or invalid service credential
        "403":
          description: Logical agent is inactive, belongs to another service, tenant, or tool policy
  /rag/documents:
    post:
      operationId: ingestKnowledgeDocument
      x-vextis-tool-policy: ingest_knowledge_document
      description: >-
        Indexes one already chunked and embedded document into the tenant knowledge
        base. Agent Runtime does the chunking and embedding; Enterprise Core remains
        the only writer and re-checks the tenant and the tool policy. Held by the
        dedicated ingestor agent, never by a retrieval agent.
      security:
        - serviceBearer: []
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/AgentId"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IngestKnowledgeDocumentRequest"
      responses:
        "200":
          description: Document indexed; version is bumped when the content hash changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestKnowledgeDocumentResponse"
        "400":
          description: Payload is invalid, or a chunk disagrees with the document embedding space
        "401":
          description: Missing or invalid service credential
        "403":
          description: Logical agent is inactive, belongs to another service, tenant, or tool policy
  /live-sessions/{sessionId}/validate:
    post:
      operationId: validateLiveSession
      description: >-
        Called by Agent Runtime when a browser opens the Live WebSocket, to check the
        opaque session token the browser presented. The caller does not know the
        tenant in advance (the token is the only thing the browser hands it); the
        tenant is returned in the response once the token is confirmed valid.
      security:
        - serviceBearer: []
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/AgentId"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/LiveSessionToken"
      responses:
        "200":
          description: Session token was checked; see the valid field for the outcome
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveSessionValidation"
        "401":
          description: Missing or invalid service credential
        "403":
          description: Agent is not authorized for this tool
        "404":
          description: Session does not exist
components:
  securitySchemes:
    serviceBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque-service-token
  parameters:
    TenantId:
      name: X-Tenant-Id
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 100
    AgentId:
      name: X-Agent-Id
      in: header
      required: true
      description: Active logical agent ID delegated by the authenticated Agent Runtime.
      schema:
        type: string
        minLength: 1
        maxLength: 150
        example: vextis_inventory_agent
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: true
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
    ServerlessAuthorization:
      name: X-Serverless-Authorization
      in: header
      required: false
      description: >-
        Google-signed identity token for the private Cloud Run hop. Cloud Run
        consumes it for its own IAM check and leaves Authorization carrying the
        application service credential. Absent outside Cloud Run.
      schema:
        type: string
        pattern: "^Bearer .+"
    LiveSessionToken:
      name: X-Live-Session-Token
      in: header
      required: true
      schema:
        type: string
        minLength: 16
  schemas:
    CustomerContext:
      type: object
      additionalProperties: false
      required: [id, legalName, active]
      properties:
        id:
          type: string
          format: uuid
        legalName:
          type: string
          maxLength: 200
        active:
          type: boolean
    StockContext:
      type: object
      additionalProperties: false
      required: [sku, availableQuantity]
      properties:
        sku:
          type: string
          maxLength: 100
        availableQuantity:
          type: integer
          minimum: 0
    CreditContext:
      type: object
      additionalProperties: false
      required: [customerId, standing, maxPaymentTermsDays]
      properties:
        customerId:
          type: string
          format: uuid
        standing:
          type: string
          enum: [GOOD, REVIEW, BLOCKED]
        maxPaymentTermsDays:
          type: integer
          minimum: 0
          maximum: 365
    StartPlanningRequest:
      type: object
      additionalProperties: false
      required: [eventId, documentUri]
      properties:
        eventId:
          type: string
          format: uuid
        documentUri:
          type: string
          pattern: "^gs://"
          maxLength: 1000
    PlanningContext:
      type: object
      additionalProperties: false
      required:
        [id, state, correlationId, updatedAt, goal, purchaseOrderNumber, customerName, documentUri, readinessEvaluated]
      properties:
        id:
          type: string
          format: uuid
        state:
          type: string
          enum: [PLANNING, RUNNING, WAITING_APPROVAL, COMPLETED, FAILED]
        correlationId:
          type: string
        updatedAt:
          type: string
          format: date-time
        goal:
          type: string
          maxLength: 500
        purchaseOrderNumber:
          type: string
          maxLength: 100
        customerName:
          type: string
          maxLength: 200
        documentUri:
          type: string
          pattern: "^gs://"
          maxLength: 1000
        readinessEvaluated:
          type: boolean
        approvalStatus:
          type: [string, "null"]
          enum: [PENDING, APPROVED, REJECTED, null]
    RequestApprovalRequest:
      type: object
      additionalProperties: false
      required: [recommendation]
      properties:
        recommendation:
          type: string
          minLength: 1
          maxLength: 500
    RecordPlanRequest:
      type: object
      additionalProperties: false
      required: [modelId, summary, orderLines, requestedPaymentTermsDays, steps]
      properties:
        modelId:
          type: string
          minLength: 1
          maxLength: 150
        summary:
          type: string
          minLength: 1
          maxLength: 500
        orderLines:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: "#/components/schemas/ExtractedOrderLine"
        requestedPaymentTermsDays:
          type: integer
          minimum: 0
          maximum: 365
        currency:
          type: [string, "null"]
          pattern: "^[A-Z]{3}$"
        steps:
          type: array
          minItems: 1
          maxItems: 5
          items:
            $ref: "#/components/schemas/PlanStep"
    ExtractedOrderLine:
      type: object
      additionalProperties: false
      required: [sku, quantity]
      properties:
        sku:
          type: string
          minLength: 1
          maxLength: 100
          pattern: "^[A-Za-z0-9._-]+$"
        quantity:
          type: integer
          minimum: 1
          maximum: 1000000
        unitPrice:
          type: [string, "null"]
          pattern: "^(0|[1-9][0-9]*)(\\.[0-9]{1,2})?$"
    PlanStep:
      type: object
      additionalProperties: false
      required: [sequence, department, objective, requiresApproval]
      properties:
        sequence:
          type: integer
          minimum: 1
          maximum: 5
        department:
          type: string
          enum: [CRM_SALES, INVENTORY_OPERATIONS, FINANCE_BILLING]
        objective:
          type: string
          minLength: 1
          maxLength: 500
        requiresApproval:
          type: boolean
    WorkflowExecution:
      type: object
      additionalProperties: false
      required: [id, state, correlationId, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        state:
          type: string
          enum: [RECEIVED, PLANNING, RUNNING, WAITING_APPROVAL, COMPLETED, FAILED]
        correlationId:
          type: string
        updatedAt:
          type: string
          format: date-time
    ReserveStockRequest:
      type: object
      additionalProperties: false
      required: [orderId, sku, quantity]
      properties:
        orderId:
          type: string
          format: uuid
        sku:
          type: string
          minLength: 1
          maxLength: 100
          pattern: "^[A-Za-z0-9._-]+$"
        quantity:
          type: integer
          minimum: 1
          maximum: 1000000
    Reservation:
      type: object
      additionalProperties: false
      required: [id, orderId, sku, quantity, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        orderId:
          type: string
          format: uuid
        sku:
          type: string
        quantity:
          type: integer
        status:
          type: string
          enum: [RESERVED, RELEASED, FULFILLED]
        createdAt:
          type: string
          format: date-time
    Invoice:
      type: object
      additionalProperties: false
      required:
        [id, orderId, executionId, customerName, currency, subtotal, tax, total,
         status, paymentTermsDays, issuedAt, correlationId, lines]
      properties:
        id:
          type: string
          format: uuid
        orderId:
          type: string
          format: uuid
        executionId:
          type: string
          format: uuid
        customerName:
          type: string
          minLength: 1
          maxLength: 200
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
        subtotal:
          type: string
          pattern: "^(0|[1-9][0-9]*)(\\.[0-9]{2})$"
        tax:
          type: string
          pattern: "^(0|[1-9][0-9]*)(\\.[0-9]{2})$"
        total:
          type: string
          pattern: "^(0|[1-9][0-9]*)(\\.[0-9]{2})$"
        status:
          type: string
          const: ISSUED
        paymentTermsDays:
          type: integer
          minimum: 0
          maximum: 365
        issuedAt:
          type: string
          format: date-time
        correlationId:
          type: string
          minLength: 1
          maxLength: 100
        lines:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: "#/components/schemas/InvoiceLine"
    IssueInvoiceRequest:
      type: object
      additionalProperties: false
      required: [executionId]
      properties:
        executionId:
          type: string
          format: uuid
    InvoiceLine:
      type: object
      additionalProperties: false
      required: [sku, quantity, unitPrice, lineSubtotal]
      properties:
        sku:
          type: string
          pattern: "^[A-Za-z0-9._-]+$"
          maxLength: 100
        quantity:
          type: integer
          minimum: 1
          maximum: 1000000
        unitPrice:
          type: string
          pattern: "^(0|[1-9][0-9]*)(\\.[0-9]{2})$"
        lineSubtotal:
          type: string
          pattern: "^(0|[1-9][0-9]*)(\\.[0-9]{2})$"
    LiveSessionValidation:
      type: object
      additionalProperties: false
      required: [valid]
      properties:
        valid:
          type: boolean
        tenantId:
          type: [string, "null"]
        conversationId:
          type: [string, "null"]
          format: uuid
        expiresAt:
          type: [string, "null"]
          format: date-time
    EmbeddingSpace:
      description: >-
        Provider, model and dimension that produced a vector, as
        provider:model:dimension. Vectors are only ever compared within one space:
        a query embedded by one model can never match chunks embedded by another.
      type: string
      minLength: 1
      maxLength: 120
      pattern: "^[a-z0-9-]+:[A-Za-z0-9._-]+:[0-9]+$"
      examples:
        - vertex:text-embedding-004:768
        - mock-sha256:sha256-v1:768
    IngestKnowledgeDocumentRequest:
      type: object
      additionalProperties: false
      required: [documentUri, fileName, contentType, contentHash, embeddingSpace, chunks]
      properties:
        documentUri:
          type: string
          maxLength: 1000
          pattern: "^(gs://|urn:).+"
        fileName:
          type: string
          minLength: 1
          maxLength: 255
        contentType:
          type: string
          minLength: 1
          maxLength: 100
        contentHash:
          description: SHA-256 hex digest of the document body; drives versioning and idempotency.
          type: string
          pattern: "^[0-9a-f]{64}$"
        embeddingSpace:
          $ref: "#/components/schemas/EmbeddingSpace"
        chunks:
          type: array
          minItems: 1
          maxItems: 500
          items:
            $ref: "#/components/schemas/IngestKnowledgeChunk"
    IngestKnowledgeChunk:
      type: object
      additionalProperties: false
      required: [chunkIndex, chunkText, tokenCount, embedding]
      properties:
        chunkIndex:
          type: integer
          minimum: 0
        chunkText:
          type: string
          minLength: 1
          maxLength: 8000
        tokenCount:
          type: integer
          minimum: 0
        embedding:
          type: array
          minItems: 768
          maxItems: 768
          items:
            type: number
        metadata:
          type: object
          additionalProperties: true
    IngestKnowledgeDocumentResponse:
      type: object
      additionalProperties: false
      required: [documentId, documentUri, version, status, chunkCount]
      properties:
        documentId:
          type: string
          format: uuid
        documentUri:
          type: string
        version:
          type: integer
          minimum: 1
        status:
          type: string
          enum: [INDEXED, PENDING, FAILED]
        chunkCount:
          type: integer
          minimum: 0
    SearchKnowledgeRequest:
      type: object
      additionalProperties: false
      required: [embedding, embeddingSpace]
      properties:
        query:
          type: string
          maxLength: 1000
        embedding:
          type: array
          minItems: 768
          maxItems: 768
          items:
            type: number
        embeddingSpace:
          $ref: "#/components/schemas/EmbeddingSpace"
        limit:
          type: integer
          minimum: 1
          maximum: 20
          default: 5
        minScore:
          description: >-
            Floor applied to the cosine similarity. Enterprise Core raises anything
            below its configured floor (0.55 by default); a caller can tighten the
            bar but cannot remove it, because an unfiltered nearest-neighbour list
            reads downstream as if every chunk it returns were relevant evidence.
          type: number
          minimum: 0.0
          maximum: 1.0
          default: 0.55
    SearchKnowledgeResponse:
      type: object
      additionalProperties: false
      required: [matches]
      properties:
        matches:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/KnowledgeChunkMatch"
    KnowledgeChunkMatch:
      type: object
      additionalProperties: false
      required: [documentId, fileName, documentUri, chunkIndex, chunkText, similarityScore, metadata]
      properties:
        documentId:
          type: string
          format: uuid
        fileName:
          type: string
        documentUri:
          type: string
        chunkIndex:
          type: integer
          minimum: 0
        chunkText:
          type: string
        similarityScore:
          type: number
        metadata:
          type: object
          additionalProperties: true
    RegisterProposalAssetRequest:
      type: object
      additionalProperties: false
      required: [storageUri, mediaType, modelId, promptSummary, aiLabel]
      properties:
        storageUri:
          type: string
          # Only a gs:// object inside the authorized proposal assets bucket
          # and this tenant's own prefix is accepted; Enterprise Core
          # confirms the object actually exists before registering it.
          pattern: "^gs://.+"
          maxLength: 1000
        mediaType:
          type: string
          enum: [IMAGE, VIDEO]
        modelId:
          type: string
          minLength: 1
          maxLength: 150
        promptSummary:
          type: string
          minLength: 1
          maxLength: 500
        aiLabel:
          type: string
          minLength: 1
          maxLength: 100
        reservationToken:
          type: string
          maxLength: 100
    PreflightProposalAssetRequest:
      type: object
      additionalProperties: false
      properties:
        promptSummary:
          type: string
          maxLength: 500
        fingerprint:
          type: string
          maxLength: 128
    PreflightProposalAssetResponse:
      type: object
      additionalProperties: false
      required: [quoteId, authorized, tenantPrefix, correlationId]
      properties:
        quoteId:
          type: string
          format: uuid
        authorized:
          type: boolean
        tenantPrefix:
          type: string
        correlationId:
          type: string
        status:
          type: string
          enum: [RESERVED, PENDING, COMPLETED]
        owner:
          type: boolean
        reservationToken:
          type: string
        alreadyRegistered:
          type: boolean
        existingAsset:
          $ref: "#/components/schemas/ProposalAsset"
    ProposalAsset:
      type: object
      additionalProperties: false
      required: [id, quoteId, storageUri, mediaType, modelId, promptSummary, aiLabel, createdAt]
      properties:
        id:
          type: string
          format: uuid
        quoteId:
          type: string
          format: uuid
        storageUri:
          type: string
          maxLength: 1000
        mediaType:
          type: string
          enum: [IMAGE, VIDEO]
        modelId:
          type: string
          maxLength: 150
        promptSummary:
          type: string
          maxLength: 500
        aiLabel:
          type: string
          maxLength: 100
        createdAt:
          type: string
          format: date-time
