openapi: 3.1.0
info:
  title: Vextis Agent Tools API
  version: 0.4.0
  description: >-
    API interna autenticada para invocar casos de uso del Enterprise Core. The service
    credential authenticates Agent Runtime, while X-Agent-Id identifies the delegated
    logical agent whose active registry policy is enforced for each operation.
servers:
  - url: /internal/agent-tools/v1
paths:
  /crm/customers/lookup:
    get:
      operationId: lookupCustomerByLegalName
      x-vextis-tool-policy: lookup_customer
      description: Returns authoritative tenant-scoped customer context without mutating state.
      security:
        - serviceBearer: []
      parameters:
        - name: legalName
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 200
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/AgentId"
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Customer context found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerContext"
        "401":
          description: Missing or invalid service credential
        "403":
          description: Logical agent is inactive, belongs to another service, tenant, or tool policy
        "404":
          description: Customer was not found in the tenant
  /inventory/stock/{sku}:
    get:
      operationId: getStockBySku
      x-vextis-tool-policy: get_stock
      description: Returns authoritative tenant-scoped stock without reserving or mutating it.
      security:
        - serviceBearer: []
      parameters:
        - name: sku
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 100
            pattern: "^[A-Za-z0-9._-]+$"
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/AgentId"
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Stock context found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockContext"
        "401":
          description: Missing or invalid service credential
        "403":
          description: Logical agent is inactive, belongs to another service, tenant, or tool policy
        "404":
          description: SKU was not found in the tenant
  /billing/customers/{customerId}/credit:
    get:
      operationId: getCustomerCredit
      x-vextis-tool-policy: get_credit
      description: Returns authoritative tenant-scoped credit context without mutating it.
      security:
        - serviceBearer: []
      parameters:
        - name: customerId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/AgentId"
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Credit context found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreditContext"
        "401":
          description: Missing or invalid service credential
        "403":
          description: Logical agent is inactive, belongs to another service, tenant, or tool policy
        "404":
          description: Credit profile was not found in the tenant
  /workflows/{executionId}/planning:
    post:
      operationId: startExecutionPlanning
      x-vextis-tool-policy: start_execution_planning
      security:
        - serviceBearer: []
      parameters:
        - name: executionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/AgentId"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartPlanningRequest"
      responses:
        "200":
          description: Execution moved to planning, or the idempotent result was returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanningContext"
        "401":
          description: Missing or invalid service credential
        "403":
          description: Agent is not authorized; trusted execution context is recorded as denied evidence
        "409":
          description: Event context does not match the execution or the transition is invalid
  /workflows/{executionId}/plan:
    post:
      operationId: recordExecutionPlan
      x-vextis-tool-policy: record_execution_plan
      security:
        - serviceBearer: []
      parameters:
        - name: executionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/AgentId"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordPlanRequest"
      responses:
        "200":
          description: Structured plan recorded and execution moved to running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowExecution"
        "401":
          description: Missing or invalid service credential
        "403":
          description: Agent is not authorized; trusted execution context is recorded as denied evidence
        "409":
          description: Execution context or state does not allow recording the plan
  /workflows/{executionId}/readiness:
    post:
      operationId: evaluateOrderReadiness
      x-vextis-tool-policy: evaluate_order_readiness
      security:
        - serviceBearer: []
      parameters:
        - name: executionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/AgentId"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Authoritative read-only checks were evaluated and recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowExecution"
        "401":
          description: Missing or invalid service credential
        "403":
          description: Agent is not authorized; trusted execution context is recorded as denied evidence
        "409":
          description: The execution has no structured order facts or cannot be evaluated
  /workflows/{executionId}/approval:
    post:
      operationId: requestWorkflowApproval
      x-vextis-tool-policy: request_workflow_approval
      security:
        - serviceBearer: []
      parameters:
        - name: executionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/AgentId"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestApprovalRequest"
      responses:
        "200":
          description: Recommendation was bound to Core evidence and is waiting for human approval
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowExecution"
        "401":
          description: Missing or invalid service credential
        "403":
          description: Agent is not authorized; trusted execution context is recorded as denied evidence
        "409":
          description: Readiness is missing or the execution is not eligible for approval
  /inventory/reservations:
    post:
      operationId: reserveStock
      x-vextis-tool-policy: reserve_stock
      security:
        - serviceBearer: []
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/AgentId"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReserveStockRequest"
      responses:
        "201":
          description: Stock reserved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reservation"
        "401":
          description: Missing or invalid service credential
        "403":
          description: Agent is not authorized for this tool or scope
        "409":
          description: Insufficient stock or conflicting business state
  /billing/orders/{orderId}/invoice:
    post:
      operationId: createInvoice
      x-vextis-tool-policy: create_invoice
      description: >-
        Issues the single Finance-owned invoice from the approved plan after every
        order line is reserved. Prices and currency are read from Core's persisted
        approved context; the agent cannot submit or calculate financial totals.
      security:
        - serviceBearer: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/AgentId"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IssueInvoiceRequest"
      responses:
        "201":
          description: Invoice issued, or the original idempotent invoice was returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
        "401":
          description: Missing or invalid service credential
        "403":
          description: Logical agent is not authorized for invoice issuance
        "404":
          description: Approved order execution was not found in the tenant
        "409":
          description: Order is not approved, completed, fully reserved, or priced
  /quotes/{quoteId}/assets:
    post:
      operationId: registerQuoteAsset
      parameters:
        - name: quoteId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/AgentId"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterQuoteAssetRequest"
      responses:
        "201":
          description: Generated asset registered against the quote
        "403":
          description: Agent is not authorized to register quote assets
  /live-sessions/{sessionId}/validate:
    post:
      operationId: validateLiveSession
      description: >-
        Called by Agent Runtime when a browser opens the Live WebSocket, to check the
        opaque session token the browser presented. The caller does not know the
        tenant in advance (the token is the only thing the browser hands it); the
        tenant is returned in the response once the token is confirmed valid.
      security:
        - serviceBearer: []
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/AgentId"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/LiveSessionToken"
      responses:
        "200":
          description: Session token was checked; see the valid field for the outcome
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveSessionValidation"
        "401":
          description: Missing or invalid service credential
        "403":
          description: Agent is not authorized for this tool
        "404":
          description: Session does not exist
components:
  securitySchemes:
    serviceBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque-service-token
  parameters:
    TenantId:
      name: X-Tenant-Id
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 100
    AgentId:
      name: X-Agent-Id
      in: header
      required: true
      description: Active logical agent ID delegated by the authenticated Agent Runtime.
      schema:
        type: string
        minLength: 1
        maxLength: 150
        example: vextis_inventory_agent
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: true
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
    LiveSessionToken:
      name: X-Live-Session-Token
      in: header
      required: true
      schema:
        type: string
        minLength: 16
  schemas:
    CustomerContext:
      type: object
      additionalProperties: false
      required: [id, legalName, active]
      properties:
        id:
          type: string
          format: uuid
        legalName:
          type: string
          maxLength: 200
        active:
          type: boolean
    StockContext:
      type: object
      additionalProperties: false
      required: [sku, availableQuantity]
      properties:
        sku:
          type: string
          maxLength: 100
        availableQuantity:
          type: integer
          minimum: 0
    CreditContext:
      type: object
      additionalProperties: false
      required: [customerId, standing, maxPaymentTermsDays]
      properties:
        customerId:
          type: string
          format: uuid
        standing:
          type: string
          enum: [GOOD, REVIEW, BLOCKED]
        maxPaymentTermsDays:
          type: integer
          minimum: 0
          maximum: 365
    StartPlanningRequest:
      type: object
      additionalProperties: false
      required: [eventId, documentUri]
      properties:
        eventId:
          type: string
          format: uuid
        documentUri:
          type: string
          pattern: "^gs://"
          maxLength: 1000
    PlanningContext:
      type: object
      additionalProperties: false
      required:
        [id, state, correlationId, updatedAt, goal, purchaseOrderNumber, customerName, documentUri, readinessEvaluated]
      properties:
        id:
          type: string
          format: uuid
        state:
          type: string
          enum: [PLANNING, RUNNING, WAITING_APPROVAL, COMPLETED, FAILED]
        correlationId:
          type: string
        updatedAt:
          type: string
          format: date-time
        goal:
          type: string
          maxLength: 500
        purchaseOrderNumber:
          type: string
          maxLength: 100
        customerName:
          type: string
          maxLength: 200
        documentUri:
          type: string
          pattern: "^gs://"
          maxLength: 1000
        readinessEvaluated:
          type: boolean
        approvalStatus:
          type: [string, "null"]
          enum: [PENDING, APPROVED, REJECTED, null]
    RequestApprovalRequest:
      type: object
      additionalProperties: false
      required: [recommendation]
      properties:
        recommendation:
          type: string
          minLength: 1
          maxLength: 500
    RecordPlanRequest:
      type: object
      additionalProperties: false
      required: [modelId, summary, orderLines, requestedPaymentTermsDays, steps]
      properties:
        modelId:
          type: string
          minLength: 1
          maxLength: 150
        summary:
          type: string
          minLength: 1
          maxLength: 500
        orderLines:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: "#/components/schemas/ExtractedOrderLine"
        requestedPaymentTermsDays:
          type: integer
          minimum: 0
          maximum: 365
        currency:
          type: [string, "null"]
          pattern: "^[A-Z]{3}$"
        steps:
          type: array
          minItems: 1
          maxItems: 5
          items:
            $ref: "#/components/schemas/PlanStep"
    ExtractedOrderLine:
      type: object
      additionalProperties: false
      required: [sku, quantity]
      properties:
        sku:
          type: string
          minLength: 1
          maxLength: 100
          pattern: "^[A-Za-z0-9._-]+$"
        quantity:
          type: integer
          minimum: 1
          maximum: 1000000
        unitPrice:
          type: [string, "null"]
          pattern: "^(0|[1-9][0-9]*)(\\.[0-9]{1,2})?$"
    PlanStep:
      type: object
      additionalProperties: false
      required: [sequence, department, objective, requiresApproval]
      properties:
        sequence:
          type: integer
          minimum: 1
          maximum: 5
        department:
          type: string
          enum: [CRM_SALES, INVENTORY_OPERATIONS, FINANCE_BILLING]
        objective:
          type: string
          minLength: 1
          maxLength: 500
        requiresApproval:
          type: boolean
    WorkflowExecution:
      type: object
      additionalProperties: false
      required: [id, state, correlationId, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        state:
          type: string
          enum: [RECEIVED, PLANNING, RUNNING, WAITING_APPROVAL, COMPLETED, FAILED]
        correlationId:
          type: string
        updatedAt:
          type: string
          format: date-time
    ReserveStockRequest:
      type: object
      additionalProperties: false
      required: [orderId, sku, quantity]
      properties:
        orderId:
          type: string
          format: uuid
        sku:
          type: string
          minLength: 1
          maxLength: 100
          pattern: "^[A-Za-z0-9._-]+$"
        quantity:
          type: integer
          minimum: 1
          maximum: 1000000
    Reservation:
      type: object
      additionalProperties: false
      required: [id, orderId, sku, quantity, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        orderId:
          type: string
          format: uuid
        sku:
          type: string
        quantity:
          type: integer
        status:
          type: string
          enum: [RESERVED, RELEASED, FULFILLED]
        createdAt:
          type: string
          format: date-time
    Invoice:
      type: object
      additionalProperties: false
      required:
        [id, orderId, executionId, customerName, currency, subtotal, tax, total,
         status, paymentTermsDays, issuedAt, correlationId, lines]
      properties:
        id:
          type: string
          format: uuid
        orderId:
          type: string
          format: uuid
        executionId:
          type: string
          format: uuid
        customerName:
          type: string
          minLength: 1
          maxLength: 200
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
        subtotal:
          type: string
          pattern: "^(0|[1-9][0-9]*)(\\.[0-9]{2})$"
        tax:
          type: string
          pattern: "^(0|[1-9][0-9]*)(\\.[0-9]{2})$"
        total:
          type: string
          pattern: "^(0|[1-9][0-9]*)(\\.[0-9]{2})$"
        status:
          type: string
          const: ISSUED
        paymentTermsDays:
          type: integer
          minimum: 0
          maximum: 365
        issuedAt:
          type: string
          format: date-time
        correlationId:
          type: string
          minLength: 1
          maxLength: 100
        lines:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: "#/components/schemas/InvoiceLine"
    IssueInvoiceRequest:
      type: object
      additionalProperties: false
      required: [executionId]
      properties:
        executionId:
          type: string
          format: uuid
    InvoiceLine:
      type: object
      additionalProperties: false
      required: [sku, quantity, unitPrice, lineSubtotal]
      properties:
        sku:
          type: string
          pattern: "^[A-Za-z0-9._-]+$"
          maxLength: 100
        quantity:
          type: integer
          minimum: 1
          maximum: 1000000
        unitPrice:
          type: string
          pattern: "^(0|[1-9][0-9]*)(\\.[0-9]{2})$"
        lineSubtotal:
          type: string
          pattern: "^(0|[1-9][0-9]*)(\\.[0-9]{2})$"
    LiveSessionValidation:
      type: object
      additionalProperties: false
      required: [valid]
      properties:
        valid:
          type: boolean
        tenantId:
          type: [string, "null"]
        conversationId:
          type: [string, "null"]
          format: uuid
        expiresAt:
          type: [string, "null"]
          format: date-time
    RegisterQuoteAssetRequest:
      type: object
      additionalProperties: false
      required: [storageUri, mediaType, modelId, aiGenerated]
      properties:
        storageUri:
          type: string
          pattern: "^gs://"
        mediaType:
          type: string
          enum: [IMAGE, VIDEO]
        modelId:
          type: string
          minLength: 1
        aiGenerated:
          type: boolean
          const: true
